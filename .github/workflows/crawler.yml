name: Crawler

on:
  push:
  pull_request:

jobs:
  hydrogenic:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - run: mkdir sim-atlas
      - run: mkdir package

      - name: Start backend server
        run: |
          uvx sim-atlas --host 127.0.0.1 --port 8000 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
        working-directory: ./sim-atlas
      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/v1/filter_options > /dev/null; then
              echo "Server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start within 30 seconds"
          exit 1
      - name: Generate access token
        run: |
          TOKEN=$(uvx --from sim-atlas sim-atlas-access-token "CI Bot" "ci@example.com")
          echo "SIM_ATLAS_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
        working-directory: ./sim-atlas

      - run: uv venv --python=3.12
        working-directory: ./package
      - run: uv pip install "git+https://github.com/pyiron-node-store/hydrogenic"
        working-directory: ./package
      - run: uv pip install sim-atlas-toolkit
        working-directory: ./package
      - name: upload package
        run: |
          uv run sim-atlas-upload hydrogenic \
            --api-url http://127.0.0.1:8000/api/v1 \
            --api-token "$SIM_ATLAS_API_TOKEN" \
            --module-allow flowrep \
            --log-level debug
        working-directory: ./package

      - uses: actions/upload-artifact@v7
        with:
          path: sim-atlas/artifacts.json
          archive: false
