name: Crawler

on:
  push:
  pull_request:

jobs:
  hydrogenic:
    runs-on: ubuntu-latest
    steps:
      # ---------------------------------------------------------------
      # setup
      # ---------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Conda config
        shell: bash -l {0}
        run: echo -e "channels:\n  - conda-forge\n" > .condarc
      - run: mkdir sim-atlas
      - run: mkdir package

      # ---------------------------------------------------------------
      # sim-atlas
      # ---------------------------------------------------------------
      - name: Start backend server
        run: |
          uvx sim-atlas --host 127.0.0.1 --port 8000 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
        working-directory: ./sim-atlas
      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/v1/filter_options > /dev/null; then
              echo "Server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start within 30 seconds"
          exit 1
      - name: Generate access token
        run: |
          TOKEN=$(uvx --from sim-atlas sim-atlas-access-token "CI Bot" "ci@example.com")
          echo "SIM_ATLAS_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
        working-directory: ./sim-atlas

      # ---------------------------------------------------------------
      # pyiron/pyiron_workflow_atomistics
      # ---------------------------------------------------------------
      - name: Checkout pyiron_workflow_lammps
        uses: actions/checkout@v7
        with:
          repository: pyiron/pyiron_workflow_atomistics
          path: package
      - name: miniconda setup
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: pyiron_workflow_atomistics
          channel-priority: strict
          environment-file: package/.ci_support/environment.yml
          condarc-file: .condarc
          python-version: 3.12
      - run: pip install git+https://github.com/XzzX/sim_atlas#subdirectory=toolkit
        working-directory: ./package
        shell: bash -l {0}
      - run: |
          which python
          which pip
          which sim-atlas-upload
          pip list
        shell: bash -l {0}
      - name: upload package
        run: |
          sim-atlas-upload pyiron_workflow_atomistics \
            --api-url http://127.0.0.1:8000/api/v1 \
            --api-token "$SIM_ATLAS_API_TOKEN" \
            --log-level debug \
            --no-embed \
            --recursive filesystem
        env:
          PYTHONPATH: ${{ github.workspace }}/package
        shell: bash -l {0}
      - run: rm -rf package/*

      # ---------------------------------------------------------------
      # pyiron_workflow_lammps
      # ---------------------------------------------------------------
      - name: Checkout pyiron_workflow_lammps
        uses: actions/checkout@v7
        with:
          repository: pyiron/pyiron_workflow_lammps
          path: package
      - name: miniconda setup
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: pyiron_workflow_lammps
          channel-priority: strict
          environment-file: package/.ci_support/environment.yml
          condarc-file: .condarc
          python-version: 3.12
      - run: pip install git+https://github.com/XzzX/sim_atlas#subdirectory=toolkit
        working-directory: ./package
        shell: bash -l {0}
      - run: |
          which python
          which pip
          which sim-atlas-upload
          pip list
        shell: bash -l {0}
      - name: upload package
        run: |
          sim-atlas-upload pyiron_workflow_lammps \
            --api-url http://127.0.0.1:8000/api/v1 \
            --api-token "$SIM_ATLAS_API_TOKEN" \
            --log-level debug \
            --no-embed \
            --recursive filesystem
        env:
          PYTHONPATH: ${{ github.workspace }}/package
        shell: bash -l {0}
      - run: rm -rf package/*

      # ---------------------------------------------------------------
      # hydrogenic
      # ---------------------------------------------------------------
      - run: uv venv --python=3.12
        working-directory: ./package
      - run: uv pip install "git+https://github.com/pyiron-node-store/hydrogenic"
        working-directory: ./package
      - run: uv pip install git+https://github.com/XzzX/sim_atlas#subdirectory=toolkit
        working-directory: ./package
      - name: upload package
        run: |
          uv run sim-atlas-upload hydrogenic \
            --api-url http://127.0.0.1:8000/api/v1 \
            --api-token "$SIM_ATLAS_API_TOKEN" \
            --module-allow flowrep \
            --log-level debug \
            --no-embed \
            --recursive filesystem
        working-directory: ./package
      - run: rm -rf package/*

      # ---------------------------------------------------------------
      # tensile_test
      # ---------------------------------------------------------------
      - name: Checkout tensile_test
        uses: actions/checkout@v7
        with:
          repository: pyiron-node-store/tensile_test
          path: package
      - name: miniconda setup
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: damask-test
          channel-priority: strict
          environment-file: package/.ci_support/environment.yml
          condarc-file: .condarc
          python-version: 3.12
      - run: pip install git+https://github.com/XzzX/sim_atlas#subdirectory=toolkit
        working-directory: ./package
        shell: bash -l {0}
      - run: |
          which python
          which pip
          which sim-atlas-upload
          pip list
        shell: bash -l {0}
      - name: upload package
        run: |
          sim-atlas-upload tensile_test \
            --api-url http://127.0.0.1:8000/api/v1 \
            --api-token "$SIM_ATLAS_API_TOKEN" \
            --module-allow flowrep \
            --log-level debug \
            --no-embed \
            --recursive filesystem
        env:
          PYTHONPATH: ${{ github.workspace }}/package
        shell: bash -l {0}
      - run: rm -rf package/*

      # ---------------------------------------------------------------
      # semantic_workflows
      # ---------------------------------------------------------------
      - name: Checkout tensile_test
        uses: actions/checkout@v7
        with:
          repository: pyscal/semantic-workflows
          path: package
      - name: miniconda setup
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: fec
          channel-priority: strict
          environment-file: package/environment.yml
          condarc-file: .condarc
          python-version: 3.12
      - run: pip install git+https://github.com/XzzX/sim_atlas#subdirectory=toolkit
        working-directory: ./package
        shell: bash -l {0}
      - run: |
          which python
          which pip
          which sim-atlas-upload
          pip list
        shell: bash -l {0}
      - name: upload package
        run: |
          sim-atlas-upload semantic_workflows \
            --api-url http://127.0.0.1:8000/api/v1 \
            --api-token "$SIM_ATLAS_API_TOKEN" \
            --log-level debug \
            --no-embed \
            --recursive filesystem
        env:
          PYTHONPATH: ${{ github.workspace }}/package
        shell: bash -l {0}
      - run: rm -rf package/*

      - uses: actions/upload-artifact@v7
        with:
          path: sim-atlas/artifacts.json
          archive: false
